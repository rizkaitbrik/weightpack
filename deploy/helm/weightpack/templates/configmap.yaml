apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "weightpack.fullname" . }}-config
  labels:
    {{- include "weightpack.labels" . | nindent 4 }}
data:
  catalogue.json: {{ dict "models" (.Values.catalogue.models | default list) | toPrettyJson | quote }}
  policy.json: {{ dict "rules" (.Values.trust.rules | default list) | toPrettyJson | quote }}
