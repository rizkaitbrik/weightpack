{{- if not .Values.auth.existingSecret }}
{{- $name := include "weightpack.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "weightpack.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing (index $existing.data "agent-key") }}
  agent-key: {{ index $existing.data "agent-key" }}
  {{- else }}
  agent-key: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
  {{- with .Values.auth.apiKey }}
  api-key: {{ . | b64enc }}
  {{- end }}
{{- end }}
