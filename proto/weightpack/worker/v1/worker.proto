// Contract between wpkd (Go) and the Python build workers, over a local
// gRPC socket. The daemon owns the store and does no per-weight work; the
// workers do all of it (squash, training, delta extraction, codecs, evals).
//
// Blob access: the daemon hands the worker the paths of the blobs it needs,
// which the worker opens read-only, and a staging directory for its output.
// The daemon then verifies each output file and stores it itself, so only
// the daemon ever writes to the store.
//
// Generated code: libs/go/workerpb (Go) and python/worker/weightpack/worker/v1
// (Python). Regenerate with: npx nx run proto:generate
syntax = "proto3";

package weightpack.worker.v1;

option go_package = "github.com/rizkaitbrik/weightpack/libs/go/workerpb;workerpb";

service Worker {
  // Encode a full fine-tune as a delta over its parent, tensor by tensor,
  // writing one delta file per tensor that changed to out_dir.
  rpc EncodeLayer(EncodeLayerRequest) returns (EncodeLayerResponse);
  // Score models on an eval suite: a fine-tune and the model its lossy
  // layer gives back, say, so the build can gate on the drop.
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
  // Report the worker's version and the codecs it supports.
  rpc Info(InfoRequest) returns (InfoResponse);
  // Bake XOR and LoRA layers into the base tensors they modify and write the
  // merged tensors to out_dir.
  rpc Squash(SquashRequest) returns (SquashResponse);
  // Train a MIX's router with its experts frozen (ROUTER train), reporting
  // progress as it goes; the last message carries the result.
  rpc TrainRouter(TrainRouterRequest) returns (stream TrainRouterProgress);
}

enum Codec {
  CODEC_UNSPECIFIED = 0;
  CODEC_XOR = 1;      // lossless
  CODEC_BIT1 = 2;     // lossy, sign bits + one scale per matrix
  CODEC_SPARSE = 3;   // lossy, drop and rescale
  CODEC_LORA = 4;     // pass-through for adapters
}

// An XOR layer: delta.xor.v1 blobs, each holding one tensor's bits XORed
// with the same tensor of the layer's parent. The daemon hands the worker
// uncompressed files, whatever entropy coder the store keeps them in.
message XORLayer {
  string id = 1;
  repeated Blob blobs = 2;
}

message EncodeLayerRequest {
  // CODEC_XOR (exact bits), CODEC_BIT1 or CODEC_SPARSE (lossy; see
  // weightpack_worker/lossy.py for their files).
  Codec codec = 1;
  // The parent's tensors: the base layer's tensor.v1 blobs, then the XOR
  // layers between the base and the new layer, bottom first. XOR layers can
  // only sit on the base or on other XOR layers, so the parent's bits are
  // exact.
  repeated Blob base = 2;
  repeated XORLayer parents = 3;
  // The fine-tuned model's safetensors files. Its tensor names, dtypes and
  // shapes must match the base's.
  repeated string target_files = 4;
  // Directory the worker writes deltas to: one safetensors file per tensor
  // that differs from the parent. For XOR it holds target XOR parent with
  // the tensor's name, dtype and shape; for a lossy codec, the tensor's
  // encoded delta. The daemon checks and stores them.
  string out_dir = 5;
  // CODEC_SPARSE: the fraction of each matrix's delta entries kept, in
  // (0, 1].
  double density = 6;
  // A lossy codec, if set: a directory to write the model the layer gives
  // back into (the parent plus each decoded delta, beside the fine-tune's
  // config and tokenizer), so it can be evaluated against the fine-tune.
  string reconstruct_dir = 7;
  // CODEC_BIT1: steps of scale calibration, which distils the fine-tune into
  // the per-matrix scales on its own replies to general prompts (see
  // weightpack_worker/calibrate.py); 0 keeps each mean absolute delta. The
  // target files' directory must then be a model directory.
  int32 calibration_steps = 8;
  // A Jinja template replacing the tokenizer's chat template, for the
  // calibration prompts.
  string chat_template = 9;
}

message EncodedTensor {
  string name = 1;
  string file = 2;  // file name inside out_dir
}

message EncodeLayerResponse {
  // Only tensors that differ from the parent; the rest cost nothing.
  repeated EncodedTensor tensors = 1;
  int64 unchanged = 2;  // tensors equal to the parent's
  // A lossy codec: ||delta - decoded|| / ||delta|| over every changed
  // tensor, how much of the fine-tune's change the layer misses.
  double relative_error = 3;
  // CODEC_BIT1 with calibration: the mean KL divergence per reply token
  // from the fine-tune to the layer's model on the calibration replies,
  // with the mean absolute deltas and with the calibrated scales. They are
  // equal when calibration did not help and the layer kept the former.
  double calibration_loss_before = 4;
  double calibration_loss_after = 5;
}

message EvaluateRequest {
  // Hugging Face model directories to score, in order. Without a suite the
  // first writes it: its greedy replies to general prompts.
  repeated string models = 1;
  // An eval suite file: JSON Lines of examples ({"messages"}, {"prompt",
  // "completion"} or {"text"}), or YAML naming them (name, data). "" for the
  // first model's own replies.
  string suite = 2;
  string device = 3;         // cuda, mps or cpu; "" picks the best there is
  string chat_template = 4;  // a Jinja template replacing the tokenizer's
}

message EvaluateResponse {
  string suite = 1;    // its name, or "self"
  int32 examples = 2;
  int64 tokens = 3;    // learnt tokens each model is scored on
  repeated ModelScore scores = 4;  // in the order of models
}

message ModelScore {
  double accuracy = 1;  // next-token accuracy on the learnt tokens, percent
  double loss = 2;      // mean loss per learnt token
}

message InfoRequest {}

message InfoResponse {
  string version = 1;
  repeated Codec codecs = 2;
}

// A blob in the daemon's store. The worker opens path read-only.
message Blob {
  string digest = 1;      // sha256:<hex>
  string media_type = 2;  // e.g. application/vnd.weightpack.lora.v1
  string path = 3;
}

// A LoRA layer to bake in. Each lora.v1 blob holds one module's
// <module>.lora_A.weight [r, in] and <module>.lora_B.weight [out, r], which
// modify the base tensor <module>.weight by scaling * B @ A.
message LoRALayer {
  string id = 1;
  double scaling = 2;  // alpha / rank, or alpha / sqrt(rank) for rsLoRA
  repeated Blob blobs = 3;
}

message SquashRequest {
  // The base layer's tensor.v1 blobs: safetensors files holding one tensor,
  // or several small ones packed together.
  repeated Blob base = 1;
  // Layers in chain order, bottom first. Their deltas are summed in float32
  // with the base tensor and the result is rounded once, to nearest even, to
  // the base tensor's dtype.
  repeated LoRALayer layers = 2;
  // Directory the worker writes merged tensors to, one safetensors file per
  // tensor. The daemon creates it and removes it afterwards.
  string out_dir = 3;
  // XOR layers between the base and the LoRA layers, bottom first. They are
  // applied to the base's bits first, exactly, before any LoRA math.
  repeated XORLayer xor_layers = 4;
  // Lossy layers (delta.bit1.v1 or delta.sparse.v1 blobs, one tensor's
  // delta each), bottom first. Their deltas add in float32 with the LoRA
  // layers' before the single rounding.
  repeated DeltaLayer lossy_layers = 5;
}

// A lossy layer's delta blobs, as the daemon hands them over: plain
// safetensors files.
message DeltaLayer {
  string id = 1;
  repeated Blob blobs = 2;
}

message MergedTensor {
  string name = 1;  // base tensor name, e.g. model.layers.0.self_attn.q_proj.weight
  string file = 2;  // file name inside out_dir
}

message SquashResponse {
  // Only the base tensors some layer modifies (XOR or LoRA); every other
  // tensor is unchanged and keeps its blob.
  repeated MergedTensor tensors = 1;
}

// A PEFT LoRA adapter directory, as wpk export writes one.
message Adapter {
  string id = 1;
  string dir = 2;
}

message TrainRouterRequest {
  // The serving base: a Hugging Face model directory with every layer below
  // the mix baked in, as wpkd serves it.
  string base_dir = 1;
  // The mix's experts in mix order. The router file has one row per expert
  // in this order.
  repeated Adapter experts = 2;
  repeated string targets = 3;  // canonical names: q, k, v, o, gate, up, down
  string blocks = 4;            // "" for all, or ranges such as "0-3,8-31"
  int32 top_k = 5;
  // JSON Lines training data: {"messages": [...]}, {"prompt", "completion"}
  // or {"text"} per line.
  string data = 6;
  int32 steps = 7;
  // Where to write the router: a safetensors file holding, for each routed
  // module, <module>.router.weight [experts, in] and <module>.router.bias
  // [experts], in float32. The daemon checks and stores it.
  string out_file = 8;
  string device = 9;  // cuda, mps or cpu; "" picks the best there is
  // A Jinja chat template that replaces the tokenizer's, as the image's
  // TEMPLATE does when it is served; "" keeps the tokenizer's.
  string chat_template = 10;
}

message TrainRouterProgress {
  int32 step = 1;
  int32 steps = 2;
  double loss = 3;  // smoothed training loss
  // Set on the last message only.
  bool done = 4;
  int32 examples = 5;      // trained on
  int32 heldout = 6;       // held out to measure the loss on
  double arrow_loss = 7;   // held-out loss with Arrow, the starting point
  double trained_loss = 8; // and with the trained router
  string device = 9;
  double seconds = 10;
}
