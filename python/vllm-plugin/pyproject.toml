[tool.coverage.run]
branch = true
source = [ "weightpack_vllm" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/python/vllm-plugin/html'
 --cov-report xml:'../../coverage/python/vllm-plugin/coverage.xml'
 --html='../../reports/python/vllm-plugin/unittests/html/index.html'
 --junitxml='../../reports/python/vllm-plugin/unittests/junit.xml'
"""

[project]
name = "weightpack-vllm"
version = "0.2.0"
description = "Weightpack plugin for vLLM: composition loading, expert pool, routers"
requires-python = ">=3.10,<4"
readme = 'README.md'
license = "Apache-2.0"
authors = [{ name = "Weightpack contributors" }]
dependencies = ["numpy>=1.26"]
[project.entry-points."vllm.general_plugins"]
weightpack = "weightpack_vllm:register"


[tool.hatch.build.targets.wheel]
packages = ["weightpack_vllm"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  # The routing tests run on CPU torch, as vLLM's CPU backend does.
  "torch>=2.6",
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

# On Linux, CPU-only torch wheels for the tests, not the CUDA builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
