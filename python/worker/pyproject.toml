[tool.coverage.run]
branch = true
source = [ "weightpack_worker" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/python/worker/html'
 --cov-report xml:'../../coverage/python/worker/coverage.xml'
 --html='../../reports/python/worker/unittests/html/index.html'
 --junitxml='../../reports/python/worker/unittests/junit.xml'
"""

[project]
name = "weightpack-worker"
version = "0.1.0"
description = "Weightpack build worker: training, delta import, codecs and eval runs"
requires-python = ">=3.10,<4"
readme = 'README.md'
license = "Apache-2.0"
authors = [{ name = "Weightpack contributors" }]
dependencies = [
    "grpcio>=1.85.4",
    "numpy>=1.26",
    "protobuf>=7.35.1",
]

[project.optional-dependencies]
# The reference serving engine (weightpack-engine): transformers + PEFT on
# cuda, mps or cpu. On Linux, install torch from the CUDA or CPU index you
# want; vLLM is a separate install for NVIDIA serving.
serve = ["torch>=2.6", "transformers>=4.56", "peft>=0.17"]

[project.scripts]
weightpack-worker = "weightpack_worker.server:main"
weightpack-engine = "weightpack_worker.engine:main"

[tool.hatch.build.targets.wheel]
# weightpack/worker/v1 is the generated gRPC code (npx nx run proto:generate).
packages = ["weightpack_worker", "weightpack"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "grpcio-tools>=1.85.4",
]
parity = [
    "peft>=0.21.3",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

# The parity dependency group (torch, transformers, peft) is only for the
# PEFT parity test (npx nx run worker:parity). On Linux, take CPU-only torch
# wheels instead of the CUDA builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
