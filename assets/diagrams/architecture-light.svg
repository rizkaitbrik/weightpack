<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img" aria-label="Architecture">
<title>Architecture</title>
<defs><style>
      .t{font:600 14px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#171917}
      .s{font:400 12px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#6E6C64}
      .m{font:400 11.5px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6E6C64}
      .tag{font:500 10px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6E6C64;letter-spacing:.06em}
      .cap{font:600 10.5px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6E6C64;letter-spacing:.12em}
      .lbl{font:500 11.5px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#171917}
      .lg{font:400 12px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#6E6C64}
      .fig{font:600 11px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6E6C64;letter-spacing:.14em}
      .edge{fill:none;stroke-width:1.6}
      .life{fill:none;stroke:#CFC9BA;stroke-width:1.2;stroke-dasharray:2 5}
      .f-none{fill:none}
      .f-bg{fill:#F4F1EA} .k-bg{stroke:#F4F1EA;stroke-width:1.4}
      .f-card{fill:#FFFFFF} .k-card{stroke:#FFFFFF;stroke-width:1.4}
      .f-ink{fill:#171917} .k-ink{stroke:#171917;stroke-width:1.4}
      .f-muted{fill:#6E6C64} .k-muted{stroke:#6E6C64;stroke-width:1.4}
      .f-border{fill:#CFC9BA} .k-border{stroke:#CFC9BA;stroke-width:1.4}
      .f-group{fill:#ECE7DB} .k-group{stroke:#ECE7DB;stroke-width:1.4}
      .f-groupBorder{fill:#D3CCBB} .k-groupBorder{stroke:#D3CCBB;stroke-width:1.4}
      .f-ember{fill:#E65032} .k-ember{stroke:#E65032;stroke-width:1.4}
      .f-emberTint{fill:#FBE2DA} .k-emberTint{stroke:#FBE2DA;stroke-width:1.4}
      .f-line{fill:#3B3D39} .k-line{stroke:#3B3D39;stroke-width:1.4}
      .f-inv{fill:#171917} .k-inv{stroke:#171917;stroke-width:1.4}
      .f-invText{fill:#F4F1EA} .k-invText{stroke:#F4F1EA;stroke-width:1.4}
      .k-line{stroke-width:1.6} .k-ember{stroke-width:1.6}
      .inv{fill:#F4F1EA} .inv-e{fill:#FFFFFF;font-weight:600}</style><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#3B3D39"/></marker><marker id="a-ember" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#E65032"/></marker></defs>
<rect width="960" height="556" rx="18" fill="#F4F1EA"/>
<path d="M22,30 l3.2,-8 h11 l-3.2,8 z" fill="#E65032"/>
<text x="44" y="30" class="fig" text-anchor="start">FIG 1 · ARCHITECTURE</text>
<g transform="translate(0 48)"><rect x="20" y="14" width="180" height="58" rx="10" class="f-card k-border" /><text x="190" y="29" class="tag" text-anchor="end">GO</text><text x="110" y="35" class="t" text-anchor="middle">wpk</text><text x="110" y="51" class="s" text-anchor="middle">command-line client</text><text x="110" y="67" class="m" text-anchor="middle">wpkd.sock</text><path d="M20,178 v50 a90,8 0 0 0 180,0 v-50" class="f-bg k-border" stroke-dasharray="5 4"/><ellipse cx="110" cy="178" rx="90" ry="8" class="f-bg k-border" stroke-dasharray="5 4"/><text x="110" y="205" class="t" text-anchor="middle">OCI registry</text><text x="110" y="221" class="s" text-anchor="middle">GHCR · Harbor · ECR</text><path d="M20,270 v50 a90,8 0 0 0 180,0 v-50" class="f-bg k-border" stroke-dasharray="5 4"/><ellipse cx="110" cy="270" rx="90" ry="8" class="f-bg k-border" stroke-dasharray="5 4"/><text x="110" y="297" class="t" text-anchor="middle">Hugging Face Hub</text><text x="110" y="313" class="s" text-anchor="middle">hf:// sources</text><rect x="20" y="360" width="180" height="60" rx="10" class="f-bg k-border" stroke-dasharray="5 4"/><text x="110" y="387" class="t" text-anchor="middle">OpenAI client</text><text x="110" y="403" class="s" text-anchor="middle">any SDK or curl</text><rect x="250" y="20" width="390" height="440" rx="14" class="f-group k-groupBorder"/><text x="266" y="42" class="cap" text-anchor="start">WPKD · ONE DAEMON PER MACHINE</text><text x="626" y="42" class="tag" text-anchor="end">GO</text><rect x="274" y="64" width="160" height="66" rx="10" class="f-card k-border" /><text x="354" y="86" class="t" text-anchor="middle">Transfer</text><text x="354" y="102" class="s" text-anchor="middle">push · pull · hf://</text><text x="354" y="118" class="s" text-anchor="middle">signatures · trust</text><rect x="456" y="64" width="160" height="66" rx="10" class="f-card k-border" /><text x="536" y="86" class="t" text-anchor="middle">Builder</text><text x="536" y="102" class="s" text-anchor="middle">Weightfile · chain IDs</text><text x="536" y="118" class="s" text-anchor="middle">fingerprint · cache</text><path d="M274,196 v68 a171,8 0 0 0 342,0 v-68" class="f-card k-border" /><ellipse cx="445" cy="196" rx="171" ry="8" class="f-card k-border" /><text x="445" y="224" class="t" text-anchor="middle">Store</text><text x="445" y="240" class="m" text-anchor="middle">blobs/sha256/&lt;ab&gt;/&lt;digest&gt;</text><text x="445" y="256" class="s" text-anchor="middle">tags · build cache · decoded cache</text><rect x="274" y="340" width="342" height="66" rx="10" class="f-card k-border" /><text x="445" y="362" class="t" text-anchor="middle">Runtime</text><text x="445" y="378" class="s" text-anchor="middle">serving bases · engine processes</text><text x="445" y="394" class="s" text-anchor="middle">OpenAI gateway on :8090</text><rect x="724" y="64" width="216" height="66" rx="10" class="f-emberTint k-ember" /><text x="930" y="79" class="tag" text-anchor="end">PY</text><text x="832" y="89" class="t" text-anchor="middle">weightpack-worker</text><text x="832" y="105" class="s" text-anchor="middle">squash · xor · bit1 · sparse</text><text x="832" y="121" class="s" text-anchor="middle">evals · router training</text><rect x="724" y="340" width="216" height="66" rx="10" class="f-emberTint k-ember" /><text x="930" y="355" class="tag" text-anchor="end">PY</text><text x="832" y="365" class="t" text-anchor="middle">Engine</text><text x="832" y="381" class="s" text-anchor="middle">vLLM + weightpack-vllm</text><text x="832" y="397" class="s" text-anchor="middle">or weightpack-engine</text><text x="832" y="200" class="s" text-anchor="middle">Only wpkd writes the store.</text><text x="832" y="218" class="s" text-anchor="middle">Workers read blobs read-only</text><text x="832" y="236" class="s" text-anchor="middle">and hand back staged files.</text><path d="M200,43 L250,43" class="edge k-line"  marker-end="url(#a-line)" /><path d="M274,88 L238,88 Q230,88 230,96 L230,195 Q230,203 222,203 L200,203" class="edge k-line"  marker-end="url(#a-line)" marker-start="url(#a-line)"/><path d="M274,110 L248,110 Q240,110 240,118 L240,287 Q240,295 232,295 L200,295" class="edge k-line"  marker-end="url(#a-line)" /><path d="M200,390 L274,390" class="edge k-line"  marker-end="url(#a-line)" /><path d="M354,130 L354,188" class="edge k-line"  marker-end="url(#a-line)" /><path d="M536,130 L536,188" class="edge k-line"  marker-end="url(#a-line)" /><path d="M445,340 L445,272" class="edge k-line"  marker-end="url(#a-line)" /><path d="M616,97 L724,97" class="edge k-ember"  marker-end="url(#a-ember)" /><rect x="650.12" y="73" width="39.760000000000005" height="18" rx="9" class="f-bg"/><text x="670" y="86" class="lbl" text-anchor="middle">gRPC</text><path d="M616,373 L724,373" class="edge k-ember"  marker-end="url(#a-ember)" /><rect x="643.68" y="349" width="52.64" height="18" rx="9" class="f-bg"/><text x="670" y="362" class="lbl" text-anchor="middle">spawns</text><rect x="640.46" y="377" width="59.080000000000005" height="18" rx="9" class="f-bg"/><text x="670" y="390" class="lbl" text-anchor="middle">proxies</text><rect x="24" y="483" width="20" height="14" rx="4" class="f-card k-border" /><text x="52" y="494" class="lg" text-anchor="start">Go, in wpkd</text><rect x="151.92000000000002" y="483" width="20" height="14" rx="4" class="f-emberTint k-ember" /><text x="179.92000000000002" y="494" class="lg" text-anchor="start">Python, touches tensors</text><rect x="360.48" y="483" width="20" height="14" rx="4" class="f-bg k-border" stroke-dasharray="5 4"/><text x="388.48" y="494" class="lg" text-anchor="start">External</text></g>
</svg>
