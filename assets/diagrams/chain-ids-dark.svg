<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" width="960" height="566" role="img" aria-label="Chain IDs">
<title>Chain IDs</title>
<defs><style>
      .t{font:600 14px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#F4F1EA}
      .s{font:400 12px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#9C9A91}
      .m{font:400 11.5px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91}
      .tag{font:500 10px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91;letter-spacing:.06em}
      .cap{font:600 10.5px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91;letter-spacing:.12em}
      .lbl{font:500 11.5px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#F4F1EA}
      .lg{font:400 12px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#9C9A91}
      .fig{font:600 11px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91;letter-spacing:.14em}
      .edge{fill:none;stroke-width:1.6}
      .life{fill:none;stroke:#3B3F39;stroke-width:1.2;stroke-dasharray:2 5}
      .f-none{fill:none}
      .f-bg{fill:#171917} .k-bg{stroke:#171917;stroke-width:1.4}
      .f-card{fill:#20231F} .k-card{stroke:#20231F;stroke-width:1.4}
      .f-ink{fill:#F4F1EA} .k-ink{stroke:#F4F1EA;stroke-width:1.4}
      .f-muted{fill:#9C9A91} .k-muted{stroke:#9C9A91;stroke-width:1.4}
      .f-border{fill:#3B3F39} .k-border{stroke:#3B3F39;stroke-width:1.4}
      .f-group{fill:#1C1F1B} .k-group{stroke:#1C1F1B;stroke-width:1.4}
      .f-groupBorder{fill:#363A33} .k-groupBorder{stroke:#363A33;stroke-width:1.4}
      .f-ember{fill:#E65032} .k-ember{stroke:#E65032;stroke-width:1.4}
      .f-emberTint{fill:#3A231C} .k-emberTint{stroke:#3A231C;stroke-width:1.4}
      .f-line{fill:#C9C5BA} .k-line{stroke:#C9C5BA;stroke-width:1.4}
      .f-inv{fill:#F4F1EA} .k-inv{stroke:#F4F1EA;stroke-width:1.4}
      .f-invText{fill:#171917} .k-invText{stroke:#171917;stroke-width:1.4}
      .k-line{stroke-width:1.6} .k-ember{stroke-width:1.6}
      .inv{fill:#171917} .inv-e{fill:#FFFFFF;font-weight:600}</style><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#C9C5BA"/></marker><marker id="a-ember" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#E65032"/></marker></defs>
<rect width="960" height="566" rx="18" fill="#171917"/>
<path d="M22,30 l3.2,-8 h11 l-3.2,8 z" fill="#E65032"/>
<text x="44" y="30" class="fig" text-anchor="start">FIG 3 · CHAIN IDS</text>
<g transform="translate(0 48)"><rect x="330" y="20" width="300" height="58" rx="10" class="f-card k-border" /><text x="480" y="46" class="t" text-anchor="middle">MIX tasks</text><text x="480" y="62" class="s" text-anchor="middle">router: trained · top_k=1</text><rect x="170" y="130" width="170" height="58" rx="10" class="f-emberTint k-ember" /><text x="255" y="156" class="t" text-anchor="middle">python</text><text x="255" y="172" class="s" text-anchor="middle">lora · expert</text><rect x="395" y="130" width="170" height="58" rx="10" class="f-emberTint k-ember" /><text x="480" y="156" class="t" text-anchor="middle">sql</text><text x="480" y="172" class="s" text-anchor="middle">lora · expert</text><rect x="620" y="130" width="170" height="58" rx="10" class="f-emberTint k-ember" /><text x="705" y="156" class="t" text-anchor="middle">math</text><text x="705" y="172" class="s" text-anchor="middle">lora · expert</text><rect x="330" y="240" width="300" height="58" rx="10" class="f-emberTint k-ember" /><text x="480" y="266" class="t" text-anchor="middle">LAYER support</text><text x="480" y="282" class="m" text-anchor="middle">chain = H(chain(base), digest)</text><rect x="330" y="322" width="300" height="58" rx="10" class="f-inv k-inv" /><text x="480" y="348" class="t inv" text-anchor="middle">base</text><text x="480" y="364" class="m inv" text-anchor="middle">chain = digest(base)</text><path d="M255,188 L255,206 Q255,214 263,214 L432,214 Q440,214 440,222 L440,240" class="edge k-line"  marker-end="url(#a-line)" /><path d="M480,188 L480,240" class="edge k-line"  marker-end="url(#a-line)" /><path d="M705,188 L705,206 Q705,214 697,214 L528,214 Q520,214 520,222 L520,240" class="edge k-line"  marker-end="url(#a-line)" /><path d="M480,322 L480,298" class="edge k-line"  marker-end="url(#a-line)" /><path d="M255,130 L255,57 Q255,49 263,49 L330,49" class="edge k-ember" stroke-dasharray="5 5" marker-end="url(#a-ember)" /><path d="M480,130 L480,78" class="edge k-ember" stroke-dasharray="5 5" marker-end="url(#a-ember)" /><rect x="434.36" y="93" width="91.28" height="18" rx="9" class="f-bg"/><text x="480" y="106" class="lbl" text-anchor="middle">by reference</text><path d="M705,130 L705,57 Q705,49 697,49 L630,49" class="edge k-ember" stroke-dasharray="5 5" marker-end="url(#a-ember)" /><rect x="20" y="410" width="450" height="62" rx="10" class="f-group k-groupBorder" /><text x="245" y="438" class="t" text-anchor="middle">Chain ID</text><text x="245" y="454" class="m" text-anchor="middle">chain(L) = sha256(chain(parent) + " " + digest(L))</text><rect x="490" y="410" width="450" height="62" rx="10" class="f-group k-groupBorder" /><text x="715" y="438" class="t" text-anchor="middle">A layer is valid only on its chain</text><text x="715" y="454" class="s" text-anchor="middle">pull and build refuse it anywhere else</text><path d="M24,500 h26" class="edge k-line"  marker-end="url(#a-line)"/><text x="60" y="504" class="lg" text-anchor="start">sits on (parent)</text><path d="M193.52,500 h26" class="edge k-ember" stroke-dasharray="5 5" marker-end="url(#a-ember)"/><text x="229.52" y="504" class="lg" text-anchor="start">mounted as an expert</text></g>
</svg>
