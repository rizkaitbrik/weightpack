<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 758" width="960" height="758" role="img" aria-label="Distribution and trust">
<title>Distribution and trust</title>
<defs><style>
      .t{font:600 14px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#F4F1EA}
