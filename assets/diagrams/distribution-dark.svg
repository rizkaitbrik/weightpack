<text x="44" y="30" class="fig" text-anchor="start">FIG 6 · DISTRIBUTION AND TRUST</text>
<g transform="translate(0 48)"><path d="M110,52 V692" class="life"/><path d="M360,52 V692" class="life"/><path d="M610,52 V692" class="life"/><path d="M850,52 V692" class="life"/><rect x="16" y="92" width="928" height="26" rx="8" class="f-group"/><text x="30" y="109" class="cap" text-anchor="start">PUBLISH</text><path d="M114,148 L354,148" class="edge k-line"  marker-end="url(#a-line)"/><rect x="186.14" y="125" width="97.72000000000001" height="18" rx="9" class="f-bg"/><text x="235" y="138" class="lbl" text-anchor="middle">push name:tag</text><path d="M364,192 L604,192" class="edge k-line"  marker-end="url(#a-line)"/><rect x="326.65999999999997" y="169" width="316.68" height="18" rx="9" class="f-bg"/><text x="485" y="182" class="lbl" text-anchor="middle">HEAD each blob · upload only missing · manifest</text><path d="M114,236 L844,236" class="edge k-ember"  marker-end="url(#a-ember)"/><rect x="373.18" y="213" width="213.64000000000001" height="18" rx="9" class="f-bg"/><text x="480" y="226" class="lbl" text-anchor="middle">sign: key, or keyless with OIDC</text><path d="M114,280 L354,280" class="edge k-ember"  marker-end="url(#a-ember)"/><rect x="124.96" y="257" width="220.08" height="18" rx="9" class="f-bg"/><text x="235" y="270" class="lbl" text-anchor="middle">Sigstore bundle (no private key)</text><path d="M364,324 L604,324" class="edge k-ember"  marker-end="url(#a-ember)"/><rect x="371.74" y="301" width="226.52" height="18" rx="9" class="f-bg"/><text x="485" y="314" class="lbl" text-anchor="middle">OCI 1.1 referrer, subject = image</text><rect x="16" y="368" width="928" height="26" rx="8" class="f-group"/><text x="30" y="385" class="cap" text-anchor="start">CONSUME</text><path d="M114,424 L354,424" class="edge k-line"  marker-end="url(#a-line)"/><rect x="153.94" y="401" width="162.12" height="18" rx="9" class="f-bg"/><text x="235" y="414" class="lbl" text-anchor="middle">pull [--exact] name:tag</text><path d="M364,468 L604,468" class="edge k-line"  marker-end="url(#a-line)"/><rect x="410.38" y="445" width="149.24" height="18" rx="9" class="f-bg"/><text x="485" y="458" class="lbl" text-anchor="middle">resolve the reference</text><path d="M360,508 L388,508 Q394,508 394,514 L394,520 Q394,526 388,526 L364,526" class="edge k-line" marker-end="url(#a-line)"/><rect x="400" y="506" width="220.08" height="18" rx="9" class="f-bg"/><text x="407" y="519" class="lbl" text-anchor="start">trust policy: longest scope wins</text><path d="M364,560 L604,560" class="edge k-ember"  marker-end="url(#a-ember)"/><rect x="374.96" y="537" width="220.08" height="18" rx="9" class="f-bg"/><text x="485" y="550" class="lbl" text-anchor="middle">fetch referrers · verify bundles</text><path d="M364,604 L604,604" class="edge k-line"  marker-end="url(#a-line)"/><rect x="323.44" y="581" width="323.12" height="18" rx="9" class="f-bg"/><text x="485" y="594" class="lbl" text-anchor="middle">manifest + config · recompute digests and chains</text><path d="M364,648 L604,648" class="edge k-line"  marker-end="url(#a-line)"/><rect x="365.29999999999995" y="625" width="239.40000000000003" height="18" rx="9" class="f-bg"/><text x="485" y="638" class="lbl" text-anchor="middle">fetch only the missing tensor blobs</text><rect x="30" y="0" width="160" height="50" rx="10" class="f-card k-border" /><text x="110" y="22" class="t" text-anchor="middle">wpk</text><text x="110" y="38" class="s" text-anchor="middle">holds keys</text><rect x="280" y="0" width="160" height="50" rx="10" class="f-inv k-inv" /><text x="360" y="22" class="t inv" text-anchor="middle">wpkd</text><text x="360" y="38" class="s inv" text-anchor="middle">holds credentials</text><rect x="530" y="0" width="160" height="50" rx="10" class="f-bg k-border" stroke-dasharray="5 4"/><text x="610" y="22" class="t" text-anchor="middle">OCI registry</text><text x="610" y="38" class="s" text-anchor="middle">blobs · referrers</text><rect x="770" y="0" width="160" height="50" rx="10" class="f-bg k-border" stroke-dasharray="5 4"/><text x="850" y="22" class="t" text-anchor="middle">Sigstore</text><text x="850" y="38" class="s" text-anchor="middle">Fulcio · Rekor</text></g>
