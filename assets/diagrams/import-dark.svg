<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 656" width="960" height="656" role="img" aria-label="Importing full fine-tunes">
<title>Importing full fine-tunes</title>
<defs><style>
      .t{font:600 14px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#F4F1EA}
      .s{font:400 12px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#9C9A91}
      .m{font:400 11.5px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91}
      .tag{font:500 10px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91;letter-spacing:.06em}
      .cap{font:600 10.5px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91;letter-spacing:.12em}
      .lbl{font:500 11.5px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#F4F1EA}
      .lg{font:400 12px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#9C9A91}
      .fig{font:600 11px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91;letter-spacing:.14em}
      .edge{fill:none;stroke-width:1.6}
      .life{fill:none;stroke:#3B3F39;stroke-width:1.2;stroke-dasharray:2 5}
      .f-none{fill:none}
      .f-bg{fill:#171917} .k-bg{stroke:#171917;stroke-width:1.4}
      .f-card{fill:#20231F} .k-card{stroke:#20231F;stroke-width:1.4}
      .f-ink{fill:#F4F1EA} .k-ink{stroke:#F4F1EA;stroke-width:1.4}
      .f-muted{fill:#9C9A91} .k-muted{stroke:#9C9A91;stroke-width:1.4}
      .f-border{fill:#3B3F39} .k-border{stroke:#3B3F39;stroke-width:1.4}
      .f-group{fill:#1C1F1B} .k-group{stroke:#1C1F1B;stroke-width:1.4}
      .f-groupBorder{fill:#363A33} .k-groupBorder{stroke:#363A33;stroke-width:1.4}
      .f-ember{fill:#E65032} .k-ember{stroke:#E65032;stroke-width:1.4}
      .f-emberTint{fill:#3A231C} .k-emberTint{stroke:#3A231C;stroke-width:1.4}
      .f-line{fill:#C9C5BA} .k-line{stroke:#C9C5BA;stroke-width:1.4}
      .f-inv{fill:#F4F1EA} .k-inv{stroke:#F4F1EA;stroke-width:1.4}
      .f-invText{fill:#171917} .k-invText{stroke:#171917;stroke-width:1.4}
      .k-line{stroke-width:1.6} .k-ember{stroke-width:1.6}
      .inv{fill:#171917} .inv-e{fill:#FFFFFF;font-weight:600}</style><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#C9C5BA"/></marker><marker id="a-ember" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#E65032"/></marker></defs>
<rect width="960" height="656" rx="18" fill="#171917"/>
<path d="M22,30 l3.2,-8 h11 l-3.2,8 z" fill="#E65032"/>
<text x="44" y="30" class="fig" text-anchor="start">FIG 5 · IMPORTING FULL FINE-TUNES</text>
<g transform="translate(0 48)"><rect x="40" y="20" width="220" height="58" rx="10" class="f-bg k-border" stroke-dasharray="5 4"/><text x="150" y="46" class="t" text-anchor="middle">Full fine-tune</text><text x="150" y="62" class="s" text-anchor="middle">safetensors · hf:// · path</text><rect x="340" y="20" width="280" height="58" rx="29" class="f-group k-groupBorder" /><text x="480" y="46" class="t" text-anchor="middle">Same tensors, tokenizer</text><text x="480" y="62" class="s" text-anchor="middle">and config as the parent?</text><rect x="700" y="20" width="240" height="58" rx="10" class="f-inv k-inv" /><text x="820" y="46" class="t inv" text-anchor="middle">Build error</text><text x="820" y="62" class="s inv" text-anchor="middle">nothing is stored</text><rect x="340" y="120" width="280" height="58" rx="10" class="f-card k-border" /><text x="480" y="146" class="t" text-anchor="middle">Delta vs parent</text><text x="480" y="162" class="s" text-anchor="middle">per tensor the fine-tune changed</text><rect x="40" y="220" width="260" height="66" rx="10" class="f-card k-border" /><text x="170" y="242" class="t" text-anchor="middle">xor</text><text x="170" y="258" class="s" text-anchor="middle">bits XORed with the parent</text><text x="170" y="274" class="s" text-anchor="middle">lossless · bit-exact</text><rect x="350" y="220" width="260" height="66" rx="10" class="f-emberTint k-ember" /><text x="480" y="242" class="t" text-anchor="middle">bit1</text><text x="480" y="258" class="s" text-anchor="middle">sign bits + one scale per matrix</text><text x="480" y="274" class="s" text-anchor="middle">scales calibrated by KL distillation</text><rect x="660" y="220" width="240" height="66" rx="10" class="f-emberTint k-ember" /><text x="780" y="242" class="t" text-anchor="middle">sparse</text><text x="780" y="258" class="s" text-anchor="middle">top-density entries</text><text x="780" y="274" class="s" text-anchor="middle">bitmap + kept values</text><rect x="40" y="340" width="260" height="58" rx="10" class="f-card k-border" /><text x="170" y="366" class="t" text-anchor="middle">Lossless layer</text><text x="170" y="382" class="s" text-anchor="middle">no fidelity record needed</text><rect x="350" y="340" width="550" height="58" rx="10" class="f-card k-border" /><text x="625" y="366" class="t" text-anchor="middle">Eval: the fine-tune vs the decoded layer</text><text x="625" y="382" class="s" text-anchor="middle">your suite (eval=) or the self suite, served as the image will be</text><rect x="500" y="440" width="240" height="52" rx="26" class="f-group k-groupBorder" /><text x="620" y="471" class="t" text-anchor="middle">drop ≤ max_drop ?</text><rect x="500" y="530" width="240" height="58" rx="10" class="f-emberTint k-ember" /><text x="620" y="556" class="t" text-anchor="middle">Lossy layer</text><text x="620" y="572" class="s" text-anchor="middle">+ fidelity record</text><path d="M260,49 L340,49" class="edge k-line"  marker-end="url(#a-line)" /><path d="M620,49 L700,49" class="edge k-line"  marker-end="url(#a-line)" /><rect x="646.56" y="25" width="26.880000000000003" height="18" rx="9" class="f-bg"/><text x="660" y="38" class="lbl" text-anchor="middle">no</text><path d="M480,78 L480,120" class="edge k-line"  marker-end="url(#a-line)" /><rect x="496" y="88" width="33.32" height="18" rx="9" class="f-bg"/><text x="503" y="101" class="lbl" text-anchor="start">yes</text><path d="M480,178 L480,190 Q480,198 472,198 L178,198 Q170,198 170,206 L170,220" class="edge k-line"  marker-end="url(#a-line)" /><path d="M480,178 L480,220" class="edge k-line"  marker-end="url(#a-line)" /><path d="M480,178 L480,190 Q480,198 488,198 L772,198 Q780,198 780,206 L780,220" class="edge k-line"  marker-end="url(#a-line)" /><path d="M170,286 L170,340" class="edge k-line"  marker-end="url(#a-line)" /><path d="M480,286 L480,340" class="edge k-ember"  marker-end="url(#a-ember)" /><path d="M780,286 L780,340" class="edge k-ember"  marker-end="url(#a-ember)" /><path d="M620,398 L620,440" class="edge k-line"  marker-end="url(#a-line)" /><path d="M620,492 L620,530" class="edge k-line"  marker-end="url(#a-line)" /><rect x="636" y="500" width="33.32" height="18" rx="9" class="f-bg"/><text x="643" y="513" class="lbl" text-anchor="start">yes</text><path d="M740,466 L917,466 Q925,466 925,458 L925,78" class="edge k-line"  marker-end="url(#a-line)" /><rect x="821.56" y="442" width="26.880000000000003" height="18" rx="9" class="f-bg"/><text x="835" y="455" class="lbl" text-anchor="middle">no</text></g>
</svg>
