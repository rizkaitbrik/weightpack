<text x="44" y="30" class="fig" text-anchor="start">FIG 8 · TOKEN ROUTING IN VLLM</text>
<g transform="translate(0 48)"><rect x="20" y="170" width="90" height="52" rx="26" class="f-card k-border" /><text x="65" y="193" class="t" text-anchor="middle">x</text><text x="65" y="209" class="s" text-anchor="middle">hidden state</text><rect x="170" y="30" width="240" height="60" rx="10" class="f-inv k-inv" /><text x="290" y="57" class="t inv" text-anchor="middle">W x</text><text x="290" y="73" class="s inv" text-anchor="middle">base product, once per token</text><rect x="170" y="160" width="240" height="72" rx="10" class="f-emberTint k-ember" /><text x="290" y="185" class="t" text-anchor="middle">Router g(x)</text><text x="290" y="201" class="m" text-anchor="middle">logit_i = |x · w_i| + b_i</text><text x="290" y="217" class="s" text-anchor="middle">top-k · softmax</text><rect x="170" y="290" width="240" height="66" rx="10" class="f-emberTint k-ember" /><text x="290" y="320" class="t" text-anchor="middle">Shrink  z = x Aᵀ</text><text x="290" y="336" class="m" text-anchor="middle">A = [A₁; A₂; A₃]</text><rect x="470" y="250" width="210" height="106" rx="10" class="f-emberTint k-ember" /><text x="575" y="284" class="t" text-anchor="middle">Gate</text><text x="575" y="300" class="s" text-anchor="middle">scale each expert’s</text><text x="575" y="316" class="s" text-anchor="middle">block of z by its</text><text x="575" y="332" class="s" text-anchor="middle">routing coefficient</text><rect x="730" y="290" width="210" height="66" rx="10" class="f-emberTint k-ember" /><text x="835" y="320" class="t" text-anchor="middle">Expand  z Bᵀ</text><text x="835" y="336" class="m" text-anchor="middle">B = [s₁B₁, s₂B₂, s₃B₃]</text><circle cx="835" cy="60" r="20" class="f-card k-line"/><text x="835" y="66" class="t" text-anchor="middle">+</text><rect x="880" y="40" width="60" height="40" rx="20" class="f-card k-border" /><text x="910" y="65" class="t" text-anchor="middle">y</text><path d="M110,196 L130,196 Q138,196 138,188 L138,68 Q138,60 146,60 L170,60" class="edge k-line"  marker-end="url(#a-line)" /><path d="M110,196 L170,196" class="edge k-line"  marker-end="url(#a-line)" /><path d="M110,196 L130,196 Q138,196 138,204 L138,315 Q138,323 146,323 L170,323" class="edge k-line"  marker-end="url(#a-line)" /><path d="M410,60 L815,60" class="edge k-line"  marker-end="url(#a-line)" /><path d="M410,196 L432,196 Q440,196 440,204 L440,272 Q440,280 448,280 L470,280" class="edge k-ember"  marker-end="url(#a-ember)" /><path d="M410,323 L470,323" class="edge k-ember"  marker-end="url(#a-ember)" /><path d="M680,323 L730,323" class="edge k-ember"  marker-end="url(#a-ember)" /><path d="M835,290 L835,80" class="edge k-ember"  marker-end="url(#a-ember)" /><rect x="799.02" y="179" width="71.96000000000001" height="18" rx="9" class="f-bg"/><text x="835" y="192" class="lbl" text-anchor="middle">Σ experts</text><path d="M855,60 L880,60" class="edge k-line"  marker-end="url(#a-line)" /><rect x="20" y="380" width="920" height="34" rx="10" class="f-group k-groupBorder" /><text x="480" y="401" class="s" text-anchor="middle">One adapter slot holds the whole MIX. Mix tokens, single-adapter tokens and base tokens share one batch.</text></g>
