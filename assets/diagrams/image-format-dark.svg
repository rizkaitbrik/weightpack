<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" height="436" role="img" aria-label="Image format">
<title>Image format</title>
<defs><style>
      .t{font:600 14px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#F4F1EA}
      .s{font:400 12px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#9C9A91}
      .m{font:400 11.5px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91}
      .tag{font:500 10px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91;letter-spacing:.06em}
      .cap{font:600 10.5px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91;letter-spacing:.12em}
      .lbl{font:500 11.5px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#F4F1EA}
      .lg{font:400 12px Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#9C9A91}
      .fig{font:600 11px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#9C9A91;letter-spacing:.14em}
      .edge{fill:none;stroke-width:1.6}
      .life{fill:none;stroke:#3B3F39;stroke-width:1.2;stroke-dasharray:2 5}
      .f-none{fill:none}
      .f-bg{fill:#171917} .k-bg{stroke:#171917;stroke-width:1.4}
      .f-card{fill:#20231F} .k-card{stroke:#20231F;stroke-width:1.4}
      .f-ink{fill:#F4F1EA} .k-ink{stroke:#F4F1EA;stroke-width:1.4}
      .f-muted{fill:#9C9A91} .k-muted{stroke:#9C9A91;stroke-width:1.4}
      .f-border{fill:#3B3F39} .k-border{stroke:#3B3F39;stroke-width:1.4}
      .f-group{fill:#1C1F1B} .k-group{stroke:#1C1F1B;stroke-width:1.4}
      .f-groupBorder{fill:#363A33} .k-groupBorder{stroke:#363A33;stroke-width:1.4}
      .f-ember{fill:#E65032} .k-ember{stroke:#E65032;stroke-width:1.4}
      .f-emberTint{fill:#3A231C} .k-emberTint{stroke:#3A231C;stroke-width:1.4}
      .f-line{fill:#C9C5BA} .k-line{stroke:#C9C5BA;stroke-width:1.4}
      .f-inv{fill:#F4F1EA} .k-inv{stroke:#F4F1EA;stroke-width:1.4}
      .f-invText{fill:#171917} .k-invText{stroke:#171917;stroke-width:1.4}
      .k-line{stroke-width:1.6} .k-ember{stroke-width:1.6}
      .inv{fill:#171917} .inv-e{fill:#FFFFFF;font-weight:600}</style><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#C9C5BA"/></marker><marker id="a-ember" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#E65032"/></marker></defs>
<rect width="960" height="436" rx="18" fill="#171917"/>
<path d="M22,30 l3.2,-8 h11 l-3.2,8 z" fill="#E65032"/>
<text x="44" y="30" class="fig" text-anchor="start">FIG 2 · IMAGE FORMAT</text>
<g transform="translate(0 48)"><rect x="20" y="150" width="180" height="70" rx="10" class="f-inv k-inv" /><text x="110" y="174" class="t inv" text-anchor="middle">OCI manifest</text><text x="110" y="190" class="s inv" text-anchor="middle">one entry per blob</text><text x="110" y="206" class="m inv" text-anchor="middle">wpk.layer · wpk.tensor</text><rect x="260" y="20" width="300" height="110" rx="10" class="f-card k-border" /><text x="410" y="48" class="t" text-anchor="middle">Config blob</text><text x="410" y="64" class="m" text-anchor="middle">weightpack.config.v1</text><text x="410" y="80" class="s" text-anchor="middle">architecture fingerprint · tokenizer</text><text x="410" y="96" class="s" text-anchor="middle">layer graph · chain IDs</text><text x="410" y="112" class="s" text-anchor="middle">fidelity records</text><rect x="600" y="20" width="340" height="110" rx="10" class="f-group k-groupBorder" /><text x="770" y="56" class="t" text-anchor="middle">Canonical blob layout</text><text x="770" y="72" class="s" text-anchor="middle">tensors sorted by name, packed data</text><text x="770" y="88" class="s" text-anchor="middle">compact header, sorted keys</text><text x="770" y="104" class="s" text-anchor="middle">same tensor → same digest, anywhere</text><rect x="260" y="160" width="680" height="190" rx="14" class="f-group k-groupBorder"/><text x="276" y="182" class="cap" text-anchor="start">LAYER BLOBS · ONE TENSOR PER BLOB · VND.WEIGHTPACK.*</text><rect x="278" y="200" width="160" height="58" rx="10" class="f-card k-border" /><text x="358" y="226" class="t" text-anchor="middle">tensor.v1</text><text x="358" y="242" class="s" text-anchor="middle">one base tensor</text><rect x="444" y="200" width="160" height="58" rx="10" class="f-card k-border" /><text x="524" y="226" class="t" text-anchor="middle">lora.v1</text><text x="524" y="242" class="s" text-anchor="middle">A and B of one module</text><rect x="610" y="200" width="160" height="58" rx="10" class="f-card k-border" /><text x="690" y="226" class="t" text-anchor="middle">delta.xor.v1+zstd</text><text x="690" y="242" class="s" text-anchor="middle">bits XORed with parent</text><rect x="776" y="200" width="160" height="58" rx="10" class="f-card k-border" /><text x="856" y="226" class="t" text-anchor="middle">router.v1</text><text x="856" y="242" class="s" text-anchor="middle">a trained MIX router</text><rect x="278" y="272" width="160" height="58" rx="10" class="f-card k-border" /><text x="358" y="298" class="t" text-anchor="middle">meta.v1</text><text x="358" y="314" class="s" text-anchor="middle">config · tokenizer · template</text><rect x="444" y="272" width="160" height="58" rx="10" class="f-emberTint k-ember" /><text x="524" y="298" class="t" text-anchor="middle">delta.bit1.v1</text><text x="524" y="314" class="s" text-anchor="middle">sign bits + one scale</text><rect x="610" y="272" width="160" height="58" rx="10" class="f-emberTint k-ember" /><text x="690" y="298" class="t" text-anchor="middle">delta.sparse.v1+zstd</text><text x="690" y="314" class="s" text-anchor="middle">bitmap + kept values</text><path d="M200,170 L222,170 Q230,170 230,162 L230,83 Q230,75 238,75 L260,75" class="edge k-line"  marker-end="url(#a-line)" /><path d="M200,200 L260,200" class="edge k-line"  marker-end="url(#a-line)" /><rect x="24" y="369" width="20" height="14" rx="4" class="f-card k-border" /><text x="52" y="380" class="lg" text-anchor="start">Lossless</text><rect x="131.76" y="369" width="20" height="14" rx="4" class="f-emberTint k-ember" /><text x="159.76" y="380" class="lg" text-anchor="start">Lossy, carries a fidelity record</text></g>
</svg>
